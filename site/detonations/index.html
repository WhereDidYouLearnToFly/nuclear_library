<style>
:root {
  --bg:         #080c07;
  --surface:    #0e160c;
  --surface2:   #162013;
  --border:     #1e3018;
  --green:      #4ec94e;
  --green-dim:  #2a6b2a;
  --green-glow: rgba(78,201,78,0.15);
  --amber:      #d4820a;
  --amber-dim:  #7a4a05;
  --amber-glow: rgba(212,130,10,0.15);
  --text:       #c2d4b0;
  --text-dim:   #6a8a5a;
  --scan-line:  rgba(0,0,0,0.06);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Share Tech Mono', 'Courier New', monospace;
  font-size: 13px;
  display: flex;
  flex-direction: column;
}
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, var(--scan-line) 3px, var(--scan-line) 4px);
  pointer-events: none;
  z-index: 9999;
}

/* ── Layout ──────────────────────────────────────────────────────────────── */
.app-body { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
#sidebar {
  width: 220px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.sb-section { padding: 10px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.sb-section.grow { flex: 1; overflow-y: auto; min-height: 0; }
.sb-sources { flex-shrink: 0; border-top: 1px solid var(--border); padding: 8px 12px; }
.sources-list { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.sources-list a { font-size: 9px; color: var(--text-dim); text-decoration: none; transition: color .15s; letter-spacing: .3px; line-height: 1.4; }
.sources-list a:hover { color: var(--green); }
.sb-title { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--amber-dim); margin-bottom: 8px; }

/* Country chips */
.country-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 4px 6px;
  border-radius: 3px;
  cursor: pointer;
  border: 1px solid transparent;
  font-size: 11px;
  color: var(--text-dim);
  transition: all .15s;
  margin-bottom: 2px;
  user-select: none;
}
.country-chip:hover { background: rgba(255,255,255,.04); }
.country-chip.off { opacity: .25; }
.country-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.country-cnt { margin-left: auto; font-size: 10px; color: var(--text-dim); }

/* Delivery chips */
.delivery-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 2px;
  border: 1px solid var(--border);
  font-size: 10px;
  cursor: pointer;
  margin: 2px 2px 0 0;
  color: var(--text-dim);
  transition: all .15s;
}
.delivery-chip.on { border-color: var(--amber-dim); color: var(--amber); background: var(--amber-glow); }

/* Decade chips */
.decade-chip {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 2px;
  border: 1px solid var(--border);
  font-size: 10px;
  cursor: pointer;
  margin: 2px 2px 0 0;
  color: var(--text-dim);
  transition: all .15s;
}
.decade-chip.on { border-color: var(--green-dim); color: var(--green); background: var(--green-glow); }

/* ── Map ──────────────────────────────────────────────────────────────────── */
#map { flex: 1; background: #050908; }

.leaflet-container { background: #050908; font-family: 'Share Tech Mono', monospace; }
.leaflet-bar a { background: var(--surface) !important; color: var(--green) !important; border-color: var(--border) !important; }
.leaflet-bar a:hover { background: var(--surface2) !important; }
.leaflet-control-attribution { background: rgba(14,22,12,.8) !important; color: var(--text-dim) !important; font-size: 9px !important; }
.leaflet-control-attribution a { color: var(--green-dim) !important; }
.leaflet-popup-content-wrapper { background: var(--surface) !important; border: 1px solid var(--amber-dim) !important; border-radius: 3px !important; box-shadow: 0 0 20px rgba(212,130,10,.25) !important; color: var(--text) !important; }
.leaflet-popup-tip { background: var(--amber-dim) !important; }
.leaflet-popup-close-button { color: var(--amber) !important; font-size: 16px !important; }

/* ── Popup ────────────────────────────────────────────────────────────────── */
.pp-site-name { font-family: 'VT323', monospace; font-size: 20px; letter-spacing: 1px; margin-bottom: 2px; }
.pp-site-meta { font-size: 10px; color: var(--text-dim); margin-bottom: 6px; }
.pp-list      { max-height: 220px; overflow-y: auto; border-top: 1px solid var(--border); }
.pp-row       { display: grid; grid-template-columns: 36px 1fr 56px 18px; gap: 0 6px; padding: 4px 2px; border-bottom: 1px solid var(--border); font-size: 11px; align-items: start; }
.pp-row-year  { color: var(--text-dim); padding-top: 1px; }
.pp-row-name  { color: var(--text); }
.pp-row-yield { color: var(--amber); text-align: right; white-space: nowrap; padding-top: 1px; }
.pp-row-type  { text-align: center; padding-top: 1px; }
.pp-notable-tag { font-size: 9px; color: var(--amber); display: block; line-height: 1.3; margin-top: 1px; }

/* ── Footer ──────────────────────────────────────────────────────────────── */
footer {
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 4px 16px;
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 10px;
  color: var(--text-dim);
  flex-shrink: 0;
  z-index: 1000;
}
#count-badge { letter-spacing: .05em; color: var(--amber-dim); }
#hover-info  { margin-left: auto; color: var(--text-dim); }
.sb-toggle {
  display: none; position: fixed; bottom: 20px; left: 20px; z-index: 600;
  background: var(--surface); border: 1px solid var(--green-dim); color: var(--green);
  font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 2px;
  padding: 8px 16px; cursor: pointer; transition: all .15s;
}
.sb-toggle:hover { background: var(--green-glow); }
.sb-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 499; }
.sb-overlay.open { display: block; }
@media (max-width: 640px) {
  .sb-toggle { display: block; }
  .app-body { position: relative; }
  #sidebar { display: none; position: absolute; top: 0; left: 0; height: 100%; z-index: 500; }
  #sidebar.open { display: flex; }
}
</style>
</head>

// ── Init translations ─────────────────────────────────────────────────────────
document.title = t('page_title');
document.getElementById('t-country').textContent  = t('t_country');
document.getElementById('t-delivery').textContent = t('t_delivery');
document.getElementById('t-decade').textContent   = t('t_decade');
document.getElementById('t-click').textContent    = t('t_click');

// ── Filter state ──────────────────────────────────────────────────────────────
const activeCountries  = new Set(Object.keys(COUNTRY_META));
const activeDeliveries = new Set(Object.keys(DELIVERY_META));
const activeDecades    = new Set(['1940','1950','1960','1970','1980','1990','2000','2010']);

function decade(year) { return String(Math.floor(year / 10) * 10); }

// ── Map setup ─────────────────────────────────────────────────────────────────
const map = L.map('map', { center: [25, 10], zoom: 2, minZoom: 2, maxZoom: 12 });

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
  maxZoom: 16,
}).addTo(map);

// ── Marker helpers ────────────────────────────────────────────────────────────
function markerRadius(yield_kt) {
  if (!yield_kt || yield_kt <= 0) return 4;
  return Math.max(4, Math.min(18, Math.log10(yield_kt + 1) * 4.5));
}

function yieldLabel(kt) {
  if (!kt || kt <= 0) return '< 1 kt';
  if (kt >= 1000) return (kt / 1000).toFixed(1) + ' Mt';
  return kt + ' kt';
}

// ── Group detonations by site ─────────────────────────────────────────────────
const siteGroups = {};
DETONATIONS.forEach(d => {
  const key = d[7];
  if (!siteGroups[key]) siteGroups[key] = [];
  siteGroups[key].push(d);
});
Object.values(siteGroups).forEach(g => g.sort((a, b) => a[4] - b[4]));

// ── Build one marker per site ─────────────────────────────────────────────────
const markerGroup = L.layerGroup().addTo(map);

const allSiteMarkers = Object.entries(siteGroups).map(([siteName, tests]) => {
  const country  = tests[0][1];
  const meta     = COUNTRY_META[country] || { color: '#888', name: country };
  const lat      = tests[0][2];
  const lon      = tests[0][3];
  const maxYield = Math.max(...tests.map(d => d[5] || 0));
  const hasNotable = tests.some(d => d[8]);

  const marker = L.circleMarker([lat, lon], {
    radius: markerRadius(maxYield),
    color: meta.color,
    fillColor: meta.color,
    fillOpacity: tests.length > 1 ? 0.45 : 0.6,
    weight: hasNotable ? 2 : 1,
    opacity: 0.9,
  });

  const translatedSite = (SITE_NAMES[LANG] || {})[siteName] || siteName;
  const rows = tests.map(([name, , , , year, yield_kt, delivery, , notable]) => {
    const tName = name.startsWith(siteName)
      ? translatedSite + name.slice(siteName.length)
      : name;
    const tNotable = notable ? ((NOTABLE_TRANS[LANG] || {})[notable] || notable) : null;
    return `
    <div class="pp-row">
      <span class="pp-row-year">${year}</span>
      <span class="pp-row-name">${tName}${tNotable ? `<span class="pp-notable-tag">${tNotable}</span>` : ''}</span>
      <span class="pp-row-yield">${yieldLabel(yield_kt)}</span>
      <span class="pp-row-type">${DELIVERY_META[delivery]?.icon || ''}</span>
    </div>`;
  }).join('');

  const countLabel = `${tests.length} ${tests.length === 1 ? t('test_s') : t('test_p')}`;

  marker.bindPopup(`
    <div class="pp-site-name" style="color:${meta.color}">${translatedSite}</div>
    <div class="pp-site-meta"><span style="color:${meta.color}">${t('country_' + country)}</span> · ${countLabel}</div>
    <div class="pp-list">${rows}</div>
  `, { maxWidth: 360, maxHeight: 320 });

  marker.on('mouseover', () => {
    document.getElementById('hover-info').textContent =
      `${siteName} · ${t('country_' + country)} · ${tests.length} ${tests.length === 1 ? t('test_s') : t('test_p')}`;
  });
  marker.on('mouseout', () => {
    document.getElementById('hover-info').textContent = '';
  });

  return { marker, tests };
});

function updateMarkers() {
  markerGroup.clearLayers();
  let count = 0;
  allSiteMarkers.forEach(({ marker, tests }) => {
    const matching = tests.filter(([, country, , , year, , delivery]) =>
      activeCountries.has(country) && activeDeliveries.has(delivery) && activeDecades.has(decade(year))
    );
    if (matching.length > 0) {
      markerGroup.addLayer(marker);
      count += matching.length;
    }
  });
  document.getElementById('count-badge').textContent = count + ' ' + t('detonations');
}

// ── Country filter ────────────────────────────────────────────────────────────
(function() {
  const el = document.getElementById('country-filters');
  const counts = {};
  DETONATIONS.forEach(d => { counts[d[1]] = (counts[d[1]] || 0) + 1; });

  Object.entries(COUNTRY_META).forEach(([code, meta]) => {
    const div = document.createElement('div');
    div.className = 'country-chip';
    div.innerHTML = `
      <div class="country-dot" style="background:${meta.color}"></div>
      <span>${t('country_' + code)}</span>
      <span class="country-cnt">${counts[code] || 0}</span>`;
    div.addEventListener('click', () => {
      if (activeCountries.has(code)) activeCountries.delete(code);
      else activeCountries.add(code);
      div.classList.toggle('off', !activeCountries.has(code));
      updateMarkers();
    });
    el.appendChild(div);
  });
})();

// ── Delivery filter ───────────────────────────────────────────────────────────
(function() {
  const el = document.getElementById('delivery-filters');
  const presentTypes = new Set(DETONATIONS.map(d => d[6]));
  Object.entries(DELIVERY_META).forEach(([key, meta]) => {
    if (!presentTypes.has(key)) return;
    const chip = document.createElement('span');
    chip.className = 'delivery-chip on';
    chip.textContent = meta.icon + ' ' + t('del_' + key);
    chip.addEventListener('click', () => {
      if (activeDeliveries.has(key)) activeDeliveries.delete(key);
      else activeDeliveries.add(key);
      chip.classList.toggle('on', activeDeliveries.has(key));
      updateMarkers();
    });
    el.appendChild(chip);
  });
})();

// ── Decade filter ─────────────────────────────────────────────────────────────
(function() {
  const el = document.getElementById('decade-filters');
  const presentDecades = new Set(DETONATIONS.map(d => decade(d[4])));
  ['1940','1950','1960','1970','1980','1990','2000','2010'].forEach(dec => {
    if (!presentDecades.has(dec)) return;
    const chip = document.createElement('span');
    chip.className = 'decade-chip on';
    chip.textContent = dec + t('dec_s');
    chip.addEventListener('click', () => {
      if (activeDecades.has(dec)) activeDecades.delete(dec);
      else activeDecades.add(dec);
      chip.classList.toggle('on', activeDecades.has(dec));
      updateMarkers();
    });
    el.appendChild(chip);
  });
})();

// ── Initial render ────────────────────────────────────────────────────────────
updateMarkers();

// ── Mobile sidebar toggle ─────────────────────────────────────────────────────
(function() {
  var btn = document.getElementById('sb-toggle');
  var overlay = document.getElementById('sb-overlay');
  var sb = document.getElementById('sidebar');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var open = sb.classList.toggle('open');
    overlay.classList.toggle('open', open);
    btn.textContent = open ? 'X CLOSE' : '= FILTERS';
  });
  overlay.addEventListener('click', function() {
    sb.classList.remove('open');
    overlay.classList.remove('open');
    btn.textContent = '= FILTERS';
  });
})();
</script>
