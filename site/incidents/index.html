<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #080c07;
  --surface:   #0e160c;
  --surface2:  #111a0f;
  --border:    #1e3018;
  --green:     #4ec94e;
  --green-dim: #2a6b2a;
  --green-glow:rgba(78,201,78,0.12);
  --amber:     #d4820a;
  --amber-dim: #7a4a05;
  --amber-glow:rgba(212,130,10,0.1);
  --text:      #c2d4b0;
  --text-dim:  #6a8a5a;
}

html, body { height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: 'Share Tech Mono', monospace; display: flex; flex-direction: column; }

/* ── Layout ──────────────────────────────────────────────────────────────── */
.app-body  { display: flex; flex: 1; overflow: hidden; }
#map       { flex: 1; background: #05090a; }

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
#sidebar {
  width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  flex-shrink: 0;
}
.sb-section {
  border-bottom: 1px solid var(--border);
  padding: 10px 12px;
}
.sb-title {
  font-family: 'VT323', monospace;
  font-size: 16px;
  color: var(--green);
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.sb-stat { font-size: 11px; color: var(--text-dim); margin-bottom: 2px; }
.sb-stat span { color: var(--green); }

/* ── Filter chips ─────────────────────────────────────────────────────────── */
.chip-group { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  font-size: 10px;
  padding: 3px 8px;
  border: 1px solid var(--border);
  border-radius: 2px;
  cursor: pointer;
  color: var(--text-dim);
  background: transparent;
  transition: all .15s;
  font-family: 'Share Tech Mono', monospace;
  letter-spacing: .5px;
  white-space: nowrap;
}
.chip:hover { color: var(--text); border-color: var(--green-dim); }
.chip.on { color: var(--green); border-color: var(--green); background: var(--green-glow); }

/* ── INES legend ─────────────────────────────────────────────────────────── */
.ines-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  color: var(--text-dim);
  padding: 2px 0;
  cursor: pointer;
  transition: color .1s;
}
.ines-row:hover { color: var(--text); }
.ines-row.on { color: var(--text); }
.ines-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.15);
}

/* ── Country list ─────────────────────────────────────────────────────────── */
.country-chip {
  display: flex;
  align-items: center;
  gap: 5px;
}
.country-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

/* ── Scrollable sections ─────────────────────────────────────────────────── */
.sb-scroll { overflow-y: auto; flex: 1; }
.sb-scroll::-webkit-scrollbar { width: 4px; }
.sb-scroll::-webkit-scrollbar-track { background: transparent; }
.sb-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.sb-sources { flex-shrink: 0; border-top: 1px solid var(--border); padding: 8px 12px; }
.sources-list { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
.sources-list a { font-size: 9px; color: var(--text-dim); text-decoration: none; transition: color .15s; letter-spacing: .3px; line-height: 1.4; }
.sources-list a:hover { color: var(--green); }

/* ── Map overrides ───────────────────────────────────────────────────────── */
.leaflet-container { background: #050908; font-family: 'Share Tech Mono', monospace; }
.leaflet-bar a { background: var(--surface) !important; color: var(--green) !important; border-color: var(--border) !important; }
.leaflet-bar a:hover { background: var(--surface2) !important; }
.leaflet-control-attribution { background: rgba(14,22,12,.8) !important; color: var(--text-dim) !important; font-size: 9px !important; }
.leaflet-control-attribution a { color: var(--green-dim) !important; }

/* ── Popup ───────────────────────────────────────────────────────────────── */
.leaflet-popup-content-wrapper { background: #0e160c !important; border: 1px solid #2a6b2a !important; border-radius: 3px !important; box-shadow: 0 0 20px rgba(78,201,78,0.2) !important; color: #c2d4b0 !important; min-width: 280px; }
.leaflet-popup-tip { background: #2a6b2a !important; }
.leaflet-popup-close-button { color: #4ec94e !important; font-size: 16px !important; }

.pp-site-name { font-family: 'VT323', monospace; font-size: 22px; color: #4ec94e; letter-spacing: 1px; margin-bottom: 2px; }
.pp-country   { font-size: 10px; color: #6a8a5a; margin-bottom: 6px; letter-spacing: 1px; }
.pp-list      { max-height: 240px; overflow-y: auto; border-top: 1px solid #1e3018; }
.pp-list::-webkit-scrollbar { width: 3px; }
.pp-list::-webkit-scrollbar-thumb { background: #2a6b2a; }

.pp-row { padding: 7px 2px; border-bottom: 1px solid #1e3018; }
.pp-row:last-child { border-bottom: none; }
.pp-row-name  { font-size: 12px; color: #c2d4b0; margin-bottom: 4px; }
.pp-ines-bar  { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.pp-ines-label { font-size: 10px; color: #6a8a5a; }
.pp-badge     { display: inline-block; padding: 1px 6px; border-radius: 2px; font-size: 9px; letter-spacing: .5px; border: 1px solid rgba(255,255,255,0.12); margin-bottom: 4px; }
.pp-row-desc  { font-size: 10px; color: #8a9a7a; line-height: 1.5; }
.sb-toggle {
  display: none; position: fixed; bottom: 20px; left: 20px; z-index: 600;
  background: #0e160c; border: 1px solid #2a6b2a; color: #4ec94e;
  font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 2px;
  padding: 8px 16px; cursor: pointer; transition: all .15s;
}
.sb-toggle:hover { background: rgba(78,201,78,0.1); }
.sb-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 499; }
.sb-overlay.open { display: block; }
@media (max-width: 640px) {
  .sb-toggle { display: block; }
  .app-body { position: relative; }
  #sidebar { display: none; position: absolute; top: 0; left: 0; height: 100%; z-index: 500; }
  #sidebar.open { display: flex; }
}
</style>
</head>

    </div>
  </div>
  <div id="map"></div>
</div>

    "Kramatorsk":             "Краматорськ",
    "Lilo Georgia":           "Ліло, Грузія",
    "Lia Georgia":            "Ліа, Грузія",
    "Tammiku Estonia":        "Таммику, Естонія",
    "Istanbul":               "Стамбул",
    "Baku Azerbaijan":        "Баку",
    "Gilan Iran":             "Гілян, Іран",
    "Ciudad Juarez":          "Сьюдад-Хуарес",
    "San Salvador":           "Сан-Сальвадор",
    "Samut Prakan":           "Самутпракан",
    "Yanango Peru":           "Яnanго, Перу",
  },
};

function t(k) { return (TR[LANG] || TR.en)[k] || TR.en[k] || k; }

// ── Filter state ─────────────────────────────────────────────────────────────
const allInes = [7, 6, 5, 4, 3, 2, 1, 0, null];
let activeInes      = new Set(allInes.map(String));
let activeCats      = new Set(Object.keys(CATEGORY_META));
let activeDecs      = new Set();
let activeCountries = new Set();

// ── Map init ─────────────────────────────────────────────────────────────────
const map = L.map('map', { center: [25, 10], zoom: 2, minZoom: 2, maxZoom: 10 });
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a> &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
  maxZoom: 16,
}).addTo(map);

// ── Group INCIDENTS by site ───────────────────────────────────────────────────
const siteGroups = {};
INCIDENTS.forEach(d => {
  const site = d[8];
  siteGroups[site] ??= [];
  siteGroups[site].push(d);
});

function inesColor(ines) {
  if (ines === null || ines === undefined) return INES_UNRATED_COLOR;
  return INES_META[ines] || INES_UNRATED_COLOR;
}

function markerRadius(ines) {
  if (ines === null || ines === undefined) return 8;
  return 5 + ines * 2.5;
}

// ── Build markers ─────────────────────────────────────────────────────────────
const siteMarkers = {};
Object.entries(siteGroups).forEach(([siteName, incidents]) => {
  const [,, lat, lon] = incidents[0];
  const maxInes = incidents.reduce((m, d) => {
    if (d[5] === null) return m;
    return (m === null || d[5] > m) ? d[5] : m;
  }, null);
  const color  = inesColor(maxInes);
  const radius = markerRadius(maxInes);

  const marker = L.circleMarker([lat, lon], {
    radius,
    fillColor: color,
    color: 'rgba(0,0,0,0.4)',
    weight: 1,
    fillOpacity: 0.85,
  });

  const translatedSite = (SITE_NAMES[LANG] || {})[siteName] || siteName;

  const countryCode = incidents[0][1];
  const countryName = t('country_' + countryCode);

  const rows = incidents.map(([name, , , , year, ines, category, notable]) => {
    const iColor = inesColor(ines);
    const iLabel = ines !== null
      ? ((TR[LANG] || TR.en).ines_labels[ines] || 'INES ' + ines)
      : t('unrated');
    const catLabel = t('cat_' + category);
    return `<div class="pp-row">
      <div class="pp-row-name">${name} (${year})</div>
      <div class="pp-ines-bar">
        <div class="ines-dot" style="background:${iColor}"></div>
        <span class="pp-ines-label">${iLabel}</span>
      </div>
      <span class="pp-badge" style="color:${iColor};border-color:${iColor}40">${catLabel}</span>
      <div class="pp-row-desc">${notable}</div>
    </div>`;
  }).join('');

  marker.bindPopup(`
    <div class="pp-site-name">${translatedSite}</div>
    <div class="pp-country">${countryName}</div>
    <div class="pp-list">${rows}</div>
  `, { maxWidth: 360, autoPan: true });

  siteMarkers[siteName] = { marker, incidents };
});

// ── Derive filter options from data ──────────────────────────────────────────
const decades    = [...new Set(INCIDENTS.map(d => Math.floor(d[4] / 10) * 10))].sort((a,b)=>a-b);
const countries  = [...new Set(INCIDENTS.map(d => d[1]))].sort();

// Init active filters to ALL
decades.forEach(d => activeDecs.add(d));
countries.forEach(c => activeCountries.add(c));

// ── Build sidebar filters ─────────────────────────────────────────────────────
// Update localized labels
document.getElementById('sb-title').textContent = t('title');
document.getElementById('lbl-shown').textContent = t('shown');
document.getElementById('lbl-total').textContent = t('total');
document.getElementById('lbl-severity').textContent = t('severity');
document.getElementById('lbl-category').textContent = t('category');
document.getElementById('lbl-decade').textContent = t('decade');
document.getElementById('lbl-country').textContent = t('country');

// INES filter
const inesFilter = document.getElementById('ines-filter');
[7,6,5,4,3,2,1,0,null].forEach(ines => {
  const color = inesColor(ines);
  const label = ines !== null ? ((TR[LANG]||TR.en).ines_labels[ines] || 'INES '+ines) : t('unrated');
  const key   = String(ines);
  const row   = document.createElement('div');
  row.className = 'ines-row on';
  row.dataset.key = key;
  row.innerHTML = `<div class="ines-dot" style="background:${color}"></div><span>${label}</span>`;
  row.addEventListener('click', () => {
    if (activeInes.has(key)) { activeInes.delete(key); row.classList.remove('on'); }
    else                      { activeInes.add(key);    row.classList.add('on'); }
    updateMarkers();
  });
  inesFilter.appendChild(row);
});

// Category chips
const catFilter = document.getElementById('cat-filter');
Object.keys(CATEGORY_META).forEach(cat => {
  const chip = document.createElement('div');
  chip.className = 'chip on';
  chip.dataset.key = cat;
  chip.textContent = t('cat_' + cat);
  chip.addEventListener('click', () => {
    if (activeCats.has(cat)) { activeCats.delete(cat); chip.classList.remove('on'); }
    else                      { activeCats.add(cat);    chip.classList.add('on'); }
    updateMarkers();
  });
  catFilter.appendChild(chip);
});

// Decade chips
const decFilter = document.getElementById('dec-filter');
decades.forEach(dec => {
  const chip = document.createElement('div');
  chip.className = 'chip on';
  chip.dataset.key = dec;
  chip.textContent = dec + 's';
  chip.addEventListener('click', () => {
    if (activeDecs.has(dec)) { activeDecs.delete(dec); chip.classList.remove('on'); }
    else                      { activeDecs.add(dec);    chip.classList.add('on'); }
    updateMarkers();
  });
  decFilter.appendChild(chip);
});

// Country chips
const countryFilter = document.getElementById('country-filter');
const counts = {};
INCIDENTS.forEach(d => { counts[d[1]] = (counts[d[1]]||0) + 1; });
countries.forEach(code => {
  const meta  = COUNTRY_META[code] || { color: '#888' };
  const chip  = document.createElement('div');
  chip.className = 'chip on country-chip';
  chip.dataset.key = code;
  chip.innerHTML = `<div class="country-dot" style="background:${meta.color}"></div>${t('country_'+code)} (${counts[code]||0})`;
  chip.addEventListener('click', () => {
    if (activeCountries.has(code)) { activeCountries.delete(code); chip.classList.remove('on'); }
    else                            { activeCountries.add(code);    chip.classList.add('on'); }
    updateMarkers();
  });
  countryFilter.appendChild(chip);
});

// ── Update markers ────────────────────────────────────────────────────────────
function updateMarkers() {
  let shown = 0;
  Object.entries(siteMarkers).forEach(([siteName, { marker, incidents }]) => {
    const matching = incidents.filter(d => {
      const dec = Math.floor(d[4] / 10) * 10;
      return activeInes.has(String(d[5]))
          && activeCats.has(d[6])
          && activeDecs.has(dec)
          && activeCountries.has(d[1]);
    });
    if (matching.length > 0) {
      if (!map.hasLayer(marker)) marker.addTo(map);
      shown += matching.length;
    } else {
      if (map.hasLayer(marker)) map.removeLayer(marker);
    }
  });
  document.getElementById('cnt-shown').textContent = shown;
  document.getElementById('cnt-total').textContent = INCIDENTS.length;
}

updateMarkers();

// ── Mobile sidebar toggle ─────────────────────────────────────────────────────
(function() {
  var btn = document.getElementById('sb-toggle');
  var overlay = document.getElementById('sb-overlay');
  var sb = document.getElementById('sidebar');
  if (!btn) return;
  btn.addEventListener('click', function() {
    var open = sb.classList.toggle('open');
    overlay.classList.toggle('open', open);
    btn.textContent = open ? 'X CLOSE' : '= FILTERS';
  });
  overlay.addEventListener('click', function() {
    sb.classList.remove('open');
    overlay.classList.remove('open');
    btn.textContent = '= FILTERS';
  });
})();
</script>
</body>
</html>
